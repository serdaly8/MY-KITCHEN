
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recettes de cuisine</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="">
<style>
    .container{
position: relative;
width: 400px;
background: beige;
padding: 28px 30px;
border: 1px solid #444;
border-radius: 5px;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;

 }

 .container .post{
    display: none;
 }
 .container .text{
font-size: 25px;
color: #666;
font-weight: 500;
text-align: center;
 }
 .container .edit{
    position: absolute;
    right: 10px;
    top: 5px;
font-size: 16px;
color: #666;
font-weight: 500;
text-align: center;
cursor: pointer;
 }

 .container .start-widget input{
  display: none;
 }

 .start-widget label{
font-size: 40px ;
color: #444;
padding: 10px;
float: right;
transition: all 0.2s ease;

 }
 input:not(:checked) ~ label:hover,
 input:not(:checked) ~ label:hover ~ label {
   color: #fd4;
 }
 input:checked ~ label{
    color: #fd4;
 }
 input#rate-5:checked ~ label{
    color: #fe7;
    text-shadow: 0 0 20px #952;
}

#rate-1:checked ~ form header:before{
   content:"😠" ;
}

#rate-2:checked ~ form header:before{
   content:"😒" ;
}

#rate-3:checked ~ form header:before{
   content:"😄" ;
}

#rate-4:checked ~ form header:before{
   content:"😎" ;
}

#rate-5:checked ~ form header:before{
   content:"😍" ;
}
.container form{
    display: none;
}
input:checked ~ form{
    display: block;
}
 form header{
    width: 100%;
    font-size: 25px;
    color: #fe7;
    font-weight: 500;
    margin: 5px 0 20px 0;
    text-align: center;
    transition: all 0.2 ease;
}
form .box{
    height: 100px;
    width: 100%;
    overflow: hidden;
    text-align: center;
}
form .box textarea{
    height: 60%;
width: 100%;
outline: none;
color: #111;
border: 1px solid #333;
background: aliceblue;
padding: 10px;
font-size: 17px;
resize: none;
}

form .textarea{
    height: 100px;
    width: 100%;
    overflow: hidden;
    text-align: center;
}
form .textarea textarea{
height: 100%;
width: 100%;
outline: none;
color: #111;
border: 1px solid #333;
background: aliceblue;
padding: 10px;
font-size: 17px;
resize: none;

}
form .btn{
    height: 45px;
    width: 100%;
    margin: 15px 0;
}

form .btn button{
    height: 100%;
    width: 100%;
    border: 1px solid #444;
    outline: none;
    background: #222;
    color: #999;
    font-size: 17px;
    font-weight: 500;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
}
form .btn button:hover{
background: #1b1b1b;
}


</style>
</head>
<body>

    <div class="container">
        <div class="post">
            <div class="text">Merci d'avoir laisser un commentaire !</div>
            <div class="edit">Modifier</div>
        </div>
        <div class="start-widget">
          <input type="radio" name="rate " id="rate-5">
          <label for="rate-5" class="ri-star-fill"></label>
          <input type="radio" name="rate " id="rate-4">
          <label for="rate-4" class="ri-star-fill"></label>
          <input type="radio" name="rate " id="rate-3">
          <label for="rate-3" class="ri-star-fill"></label>
          <input type="radio" name="rate " id="rate-2">
          <label for="rate-2" class="ri-star-fill"></label>
          <input type="radio" name="rate " id="rate-1">
          <label for="rate-1" class="ri-star-fill"></label>

          <form action="#">
            <header></header>
            <div class="box">
                <textarea cols="30" placeholder="Entrez votre nom" ></textarea>
            </div>
            <div class="textarea">
                
                <textarea cols="30" placeholder="Décrivez votre expérience !" ></textarea>
            </div>

            <div class="btn">
               
                <button type="submit">ok</button>
            </div>
          </form>
        </div>
      </div>
      <script>
        const btn = document.querySelector("button");
        const post = document.querySelector(".post");
        const widget = document.querySelector(".start-widget");
        const editBtn = document.querySelector(".edit");
        btn.onclick = ()=>{
            widget.style.display ="none";
            post.style.display ="block";
            
            editBtn.onclick = ()=>{
            widget.style.display ="block";
            post.style.display ="none";
            
            }
            return false;
        }
      </script>
</body>

</html>
